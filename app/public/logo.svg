<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kinjy logomark">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C878"/>
      <stop offset="1" stop-color="#D9A648"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.38" cy="0.34" r="0.9">
      <stop offset="0" stop-color="#8FB8E8"/>
      <stop offset="0.55" stop-color="#4A52E0"/>
      <stop offset="1" stop-color="#2E2A6E"/>
    </radialGradient>
  </defs>
  <!-- Encircling arc: a sweeping golden curve that opens at the lower right -->
  <path d="M 416 368
           A 176 176 0 1 1 432 300"
        fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
  <!-- The "K" formed by two arcs meeting at the mark's heart -->
  <path d="M 150 118 C 150 236 150 276 150 394"
        fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 330 132 C 262 190 208 232 168 258
           C 214 292 276 338 344 392"
        fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The globe dot cradled inside the K -->
  <circle cx="268" cy="262" r="46" fill="url(#globe)"/>
  <ellipse cx="268" cy="262" rx="46" ry="17" fill="none" stroke="#8FB8E8" stroke-width="4" opacity="0.55"/>
  <ellipse cx="268" cy="262" rx="17" ry="46" fill="none" stroke="#8FB8E8" stroke-width="4" opacity="0.35"/>
  <!-- Arc terminal spark -->
  <circle cx="416" cy="368" r="14" fill="#F0C878"/>
</svg>
