# Kaluta — production front door.
#
# One origin for everything: the SPA, the API and the WebSocket. That is the
# same contract the gateway was built for, and it means the browser never deals
# with CORS, never learns a second hostname, and cannot end up with an API URL
# baked into the bundle that is wrong for this deployment.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Combined with the $upstream variables below this
    # defers name resolution to request time: with a literal hostname in
    # proxy_pass, nginx resolves once at startup and *refuses to start* if the
    # gateway container is not up yet — one slow service takes the whole site
    # down, and a recreated gateway keeps a stale address until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed on the way out. The bundle is the biggest thing we serve and
    # most of it is text.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 210m;  # media-service caps uploads at 200 MB

    # --- API -------------------------------------------------------------
    location /api/ {
        set $gateway_api http://gateway:8000;
        proxy_pass $gateway_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The realtime hub lives behind this same path. Without the Upgrade
        # headers the socket handshake silently degrades to a 400 and the app
        # looks connected while delivering nothing.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A WebSocket is idle by design between messages; the default 60s would
        # cut it and force a reconnect every minute.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # --- Uploaded media --------------------------------------------------
    location /media/ {
        set $gateway_media http://gateway:8000;
        proxy_pass $gateway_media$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets ---------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached hard and for a
    # long time: a new build produces new names rather than new contents at the
    # same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Icons, share card, manifest --------------------------------------
    # These live at fixed names (a crawler and an installed PWA both cache the
    # URL, not a hash), so they get a short cache rather than the immutable one
    # above — otherwise changing the share card would take a year to reach
    # anyone who had already seen it.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/(og-image\.(png|jpg)|favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-(192|512)\.png|logo\.svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- The app ---------------------------------------------------------
    # index.html itself is never cached: it is what points at the fingerprinted
    # assets, so a stale copy pins the whole app to the previous release.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
