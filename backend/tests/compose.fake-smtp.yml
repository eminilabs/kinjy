# Points creator-service at the mail sink in tests/fake_smtp.py, so newsletters can be tested on the live stack
# with no mail server and no mail leaving the machine.
#
#   docker compose -f docker-compose.yml -f backend/tests/compose.fake-smtp.yml up -d --no-deps --force-recreate creator-service
#   python backend/tests/e2e_newsletters.py          (it starts the sink itself, on :2525)
#   docker compose up -d --no-deps --force-recreate creator-service     (back to normal)
#
# Two issues a day and a short pause between mails, so the daily limit can be reached and a send is quick.
services:
  creator-service:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SMTP_HOST: "host.docker.internal"
      SMTP_PORT: "2525"
      SMTP_FROM: "newsletters@kinjy.test"
      SMTP_STARTTLS: "0"
      SMTP_SSL: "0"
      NEWSLETTER_SEND_INTERVAL_SECONDS: "0.05"
      NEWSLETTER_MAX_ISSUES_PER_DAY: "4"
      NEWSLETTER_POSTAL_ADDRESS: "Kinjy Test Office, 1 Example Street, Nowhere"
